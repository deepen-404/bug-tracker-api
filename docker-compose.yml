version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bugtracker-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Passw0rd
      - POSTGRES_DB=BugTrackerDb
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bugtracker-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugtracker-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BugTrackerDb;Username=postgres;Password=YourStrong@Passw0rd
      - Jwt__Key=YourSuperSecretKeyHere32Characters!
      - Jwt__Issuer=BugTrackerApi
      - Jwt__Audience=BugTrackerClient
      - Jwt__DurationInMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/wwwroot/uploads
    networks:
      - bugtracker-network

volumes:
  postgres_data:
  uploads_data:

networks:
  bugtracker-network:
    driver: bridge
